# Applying migrations to the live database, from here rather than by hand.
#
# The owner should not have to paste SQL into a dashboard on a phone. This runs it for them, and
# it can be started from the Actions tab or by anybody working on the repository — including an
# assistant that has GitHub access but, by network policy, no route to the database at all.
#
# What it needs, once: a repository secret named SUPABASE_DB_URL holding the connection string
# from Supabase → Project Settings → Database → Connection string → URI, with the password in it.
# GitHub encrypts it, never prints it, and masks it if a command ever tries to echo it.

name: Apply database migrations

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type APPLY to run the migrations against the live database'
        required: true
        default: ''
      dry_run:
        description: 'Only list what would run, change nothing'
        type: boolean
        default: false
      run_only:
        description: 'Comma-separated versions to run; every other migration is recorded as already applied without being run. Leave empty to run everything outstanding.'
        required: false
        default: ''

concurrency:
  # Two runs applying migrations at once is how a database ends up half-migrated.
  group: apply-migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse unless the word was typed
        if: ${{ inputs.confirm != 'APPLY' }}
        run: |
          echo "::error::Type APPLY in the confirm box. This writes to the live database."
          exit 1

      - uses: actions/checkout@v4

      - name: Install the PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client

      # Two things make the obvious connection string fail, and neither is anybody's mistake.
      #
      # The direct host db.<ref>.supabase.co resolves to IPv6 only, and GitHub's runners have no
      # IPv6 route. The pooler is IPv4 but its hostname carries a region nobody should have to go
      # and look up.
      #
      # And a URI cannot carry a password containing '@' unless it is percent-encoded, which is a
      # trap nothing warns about: libpq reads everything after the last '@' as the host, so a
      # password like `word@9959@2005` silently becomes part of the server name.
      #
      # So no URI is built at all. The reference and password are taken out of the secret once,
      # by hand, and every connection after that is made with PGPASSWORD and separate flags —
      # where a password is a password whatever characters are in it.
      #
      # Better still: set SUPABASE_DB_PASSWORD to the password on its own, nothing around it.
      # Then there is no string to parse, nothing to encode, and no character that can be
      # mistaken for punctuation. It is used in preference to anything found in the URL.
      - name: Find a route to the database
        env:
          SECRET: ${{ secrets.SUPABASE_DB_URL }}
          PLAIN_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          set -uo pipefail
          if [ -z "$SECRET" ] && [ -z "$PLAIN_PASSWORD" ]; then
            echo "::error::Neither SUPABASE_DB_PASSWORD nor SUPABASE_DB_URL is set. The simpler of the two is SUPABASE_DB_PASSWORD: Repository → Settings → Secrets and variables → Actions → New repository secret, name SUPABASE_DB_PASSWORD, value the database password on its own."
            exit 1
          fi

          # Everything between the first ':' after the scheme and the last '@' is the password,
          # however many '@' it contains.
          body=${SECRET#postgresql://}
          body=${body#postgres://}
          userinfo=${body%@*}
          hostpart=${body##*@}
          user=${userinfo%%:*}
          pass=${userinfo#*:}

          # Percent-decoding, but only of what is actually percent-encoded: '%' followed by two
          # hex digits. The first version decoded every '%' and interpreted backslashes as well,
          # which quietly rewrites a password that legitimately contains either — a corruption
          # that arrives looking exactly like a wrong password.
          case "$pass" in
            *%[0-9A-Fa-f][0-9A-Fa-f]*)
              esc=$(printf '%s' "$pass" \
                | sed -e 's/\\/\\\\/g' -e 's/%\([0-9A-Fa-f][0-9A-Fa-f]\)/\\x\1/g')
              pass=$(printf '%b' "$esc")
              ;;
          esac

          host=${hostpart%%:*}
          rest=${hostpart#*:}
          port=${rest%%/*}
          case "$port" in ''|*[!0-9]*) port=5432 ;; esac

          # A password given on its own is trusted over one dug out of a URL: it cannot have been
          # damaged by the digging.
          source="the URL"
          if [ -n "$PLAIN_PASSWORD" ]; then
            pass=$PLAIN_PASSWORD
            source="SUPABASE_DB_PASSWORD"
          fi
          echo "::add-mask::$pass"

          ref=$(printf '%s' "$host" | sed -nE 's#^db\.([a-z0-9]+)\.supabase\.co$#\1#p')
          [ -n "$ref" ] || ref=$(printf '%s' "$user" | sed -nE 's#^postgres\.([a-z0-9]+)$#\1#p')
          [ -n "$ref" ] || ref=$PROJECT_REF

          # What was read out of the secret, so a mistyped secret is visible rather than inferred.
          # The password itself is never printed — only whether one arrived, and from where. Its
          # length is not printed either: the masker replaces short numbers that happen to occur
          # inside a secret, so the figure could not be relied upon anyway.
          echo "project=${ref:-<not found>}  user=${user:-<none>}  port=$port"
          echo "password: $([ -n "$pass" ] && echo "present, from $source" || echo 'MISSING')"

          # The reason a connection was refused is the whole answer, and the first version of this
          # threw it away into /dev/null. A pooler that has never heard of this project says
          # 'Tenant or user not found'; the one that hosts it says 'password authentication failed'
          # — the same failure to a caller who only checks the exit code, and completely different
          # facts. So every rejection is kept, and the distinct ones are printed at the end.
          errfile=$(mktemp)
          : > "$errfile"

          try() {
            local out
            out=$(PGPASSWORD="$pass" PGCONNECT_TIMEOUT=8 \
              psql -h "$1" -p "$2" -U "$3" -d postgres -tAc "select 1" 2>&1 >/dev/null)
            local rc=$?
            if [ $rc -ne 0 ]; then
              # One line, without the host in it, so that seventeen identical refusals collapse
              # into one line saying seventeen regions never heard of this project.
              printf '%s\n' "$out" \
                | sed -e 's/^psql: error: //' -e "s/${1}/<host>/g" \
                | head -2 >> "$errfile"
            fi
            return $rc
          }

          save() {
            {
              echo "DBHOST=$1"; echo "DBPORT=$2"; echo "DBUSER=$3"; echo "PGPASSWORD=$pass"
            } >> "$GITHUB_ENV"
          }

          # Only worth trying if the secret actually named a host. With SUPABASE_DB_PASSWORD alone
          # there is nothing here to try, and the pooler below is the whole route.
          if [ -n "$host" ] && [ "$host" != "$SECRET" ] && try "$host" "$port" "$user"; then
            echo "Connected to $host as $user."
            save "$host" "$port" "$user"
            exit 0
          fi

          if [ -z "$ref" ]; then
            echo "::error::Could not connect, and nothing says which Supabase project this is. Either set SUPABASE_DB_URL to the connection string, or add a repository variable SUPABASE_PROJECT_REF holding the project reference from the Supabase project URL."
            exit 1
          fi

          # ap-southeast-2 first because that is where this project was found to be — a run on
          # 25 August walked seventeen regions and this was the one that answered. Leaving the
          # rest in place costs nothing on a hit and still finds the project if it ever moves.
          echo "Trying the pooler."
          for region in ap-southeast-2 \
                        eu-central-1 eu-central-2 eu-west-1 eu-west-2 eu-west-3 eu-north-1 \
                        us-east-1 us-east-2 us-west-1 us-west-2 \
                        ap-south-1 ap-southeast-1 ap-northeast-1 ap-northeast-2 \
                        ca-central-1 sa-east-1; do
            for prefix in aws-0 aws-1; do
              h="${prefix}-${region}.pooler.supabase.com"
              # The region that hosts the project is the one that answers with anything other than
              # 'Tenant or user not found' — including a wrong password, which is worth saying out
              # loud rather than hiding behind another sixteen refusals.
              if try "$h" 5432 "postgres.${ref}"; then
                echo "Connected through ${prefix}-${region}."
                save "$h" 5432 "postgres.${ref}"
                exit 0
              fi
              if tail -2 "$errfile" | grep -qi 'password authentication failed'; then
                echo "::error::${prefix}-${region} is the right region and the project is there — the address was never the problem. The password was refused (it came from ${source}). Reset it: Supabase → Project Settings → Database → Reset database password, then put the new password on its own into the SUPABASE_DB_PASSWORD secret — no URL around it, nothing to escape."
                exit 1
              fi
            done
          done

          echo "### Why every attempt failed" >> "$GITHUB_STEP_SUMMARY"
          sort "$errfile" | uniq -c | sort -rn | head -12 | while read -r n line; do
            echo "- ${n}× ${line}" >> "$GITHUB_STEP_SUMMARY"
            echo "  ${n}× ${line}"
          done

          echo "::error::No route opened. The reasons are in the step summary — 'Tenant or user not found' everywhere means the project reference ${ref} is not one Supabase recognises, so the connection string in the secret belongs to a different project or was copied incompletely."
          exit 1

      - name: Check the connection
        run: psql -h "$DBHOST" -p "$DBPORT" -U "$DBUSER" -d postgres -tAc "select 'connected to ' || current_database() || ' as ' || current_user"

      # Which migrations the database has already had. The table is created on first use, so a
      # database that has never been migrated this way simply reports none.
      - name: Read what has already been applied
        run: |
          psql -h "$DBHOST" -p "$DBPORT" -U "$DBUSER" -d postgres -v ON_ERROR_STOP=1 -q <<'SQL'
          create table if not exists public.schema_migrations (
            version text primary key,
            applied_at timestamptz not null default statement_timestamp(),
            checksum text
          );
          SQL
          psql -h "$DBHOST" -p "$DBPORT" -U "$DBUSER" -d postgres -tAc "select version from public.schema_migrations order by version" > applied.txt
          echo "Already applied: $(wc -l < applied.txt)"

      # run_only exists because this database was migrated by hand for a fortnight before there
      # was a workflow, and nothing recorded which files had been applied. The ledger says none;
      # the database says nearly all. Re-running them is not harmless — six add table constraints,
      # and PostgreSQL has no `add constraint if not exists`.
      #
      # So the outstanding ones are named, and everything else is written into the ledger as
      # already applied without being run. After one such run the ledger tells the truth and this
      # input is never needed again.
      - name: Apply, in order, stopping at the first failure
        env:
          DRY: ${{ inputs.dry_run }}
          RUN_ONLY: ${{ inputs.run_only }}
        run: |
          set -euo pipefail
          cd sarraf-system-nwe/sarraf-system/supabase/migrations
          applied=$GITHUB_WORKSPACE/applied.txt
          ran=0
          marked=0

          wanted() {
            case ",${RUN_ONLY// /}," in *",$1,"*) return 0 ;; *) return 1 ;; esac
          }

          for f in $(ls *.sql | sort); do
            version="${f%%_*}"
            if grep -qxF "$version" "$applied"; then
              echo "  skip   $f"
              continue
            fi
            if [ -n "$RUN_ONLY" ] && ! wanted "$version"; then
              if [ "$DRY" = "true" ]; then
                echo "  would mark applied (not run)  $f"
              else
                sum=$(sha256sum "$f" | cut -d' ' -f1)
                psql -h "$DBHOST" -p "$DBPORT" -U "$DBUSER" -d postgres -v ON_ERROR_STOP=1 -q \
                  -c "insert into public.schema_migrations(version, checksum) values ('$version', '$sum') on conflict (version) do nothing"
                echo "  marked applied, not run  $f"
                marked=$((marked + 1))
              fi
              continue
            fi
            if [ "$DRY" = "true" ]; then
              echo "  would run  $f"
              continue
            fi
            echo "::group::$f"
            # Each migration in one transaction of its own: a failure leaves that file undone
            # rather than half-done, and the ones before it stay applied.
            sum=$(sha256sum "$f" | cut -d' ' -f1)
            psql -h "$DBHOST" -p "$DBPORT" -U "$DBUSER" -d postgres -v ON_ERROR_STOP=1 -q -f "$f"
            psql -h "$DBHOST" -p "$DBPORT" -U "$DBUSER" -d postgres -v ON_ERROR_STOP=1 -q \
              -c "insert into public.schema_migrations(version, checksum) values ('$version', '$sum') on conflict (version) do nothing"
            echo "::endgroup::"
            ran=$((ran + 1))
          done
          echo "Applied $ran migration(s); recorded $marked as already applied without running."

      # Two ledgers, one truth.
      #
      # This workflow records what it applied in public.schema_migrations. Supabase's own CLI
      # reads a different table, supabase_migrations.schema_migrations, which was last written
      # in the fortnight this database was migrated by hand — it holds 46 of the 90 versions
      # that are actually applied.
      #
      # Nothing breaks while nobody runs the CLI. But `supabase db push` reads that second table,
      # would conclude 44 migrations are outstanding, and would try to run them again against a
      # database that already has them — six of them add constraints, and PostgreSQL has no
      # `add constraint if not exists`. The failure would arrive during a deployment, on a live
      # database, from a command that looked routine.
      #
      # So after every apply the second ledger is brought level with the first. Insert-only and
      # idempotent: it never removes a version, never edits one, and adds nothing that is not
      # already recorded as applied.
      - name: Keep the two ledgers saying the same thing
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          psql -h "$DBHOST" -p "$DBPORT" -U "$DBUSER" -d postgres -v ON_ERROR_STOP=1 -q <<'SQL'
          create schema if not exists supabase_migrations;
          create table if not exists supabase_migrations.schema_migrations (
            version text primary key
          );
          insert into supabase_migrations.schema_migrations (version)
          select m.version from public.schema_migrations m
          on conflict (version) do nothing;
          SQL
          both=$(psql -h "$DBHOST" -p "$DBPORT" -U "$DBUSER" -d postgres -tAc \
            "select (select count(*) from public.schema_migrations) || ' / ' || (select count(*) from supabase_migrations.schema_migrations)")
          echo "Ledgers (zeman / supabase): $both"
          echo "### Migration ledgers" >> $GITHUB_STEP_SUMMARY
          echo "zeman / supabase: $both — these must be equal." >> $GITHUB_STEP_SUMMARY

      - name: Say what the database looks like now
        if: ${{ !inputs.dry_run }}
        run: |
          echo "### Businesses" >> $GITHUB_STEP_SUMMARY
          psql -h "$DBHOST" -p "$DBPORT" -U "$DBUSER" -d postgres -tAc "select id || ' — ' || name from public.tenants order by id" >> $GITHUB_STEP_SUMMARY || true
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Accounts" >> $GITHUB_STEP_SUMMARY
          psql -h "$DBHOST" -p "$DBPORT" -U "$DBUSER" -d postgres -tAc "select coalesce(admin_level, role) || ' — ' || name || ' — ' || coalesce(tenant_id, 'no business') from public.app_users where not deleted order by 1" >> $GITHUB_STEP_SUMMARY || true
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Anything wrong" >> $GITHUB_STEP_SUMMARY
          psql -h "$DBHOST" -p "$DBPORT" -U "$DBUSER" -d postgres -tAc "select coalesce(string_agg(table_name || ' — ' || state, E'\n'), 'nothing') from public.sarraf_schema_tables()" >> $GITHUB_STEP_SUMMARY || true
