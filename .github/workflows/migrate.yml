# Applying migrations to the live database, from here rather than by hand.
#
# The owner should not have to paste SQL into a dashboard on a phone. This runs it for them, and
# it can be started from the Actions tab or by anybody working on the repository — including an
# assistant that has GitHub access but, by network policy, no route to the database at all.
#
# What it needs, once: a repository secret named SUPABASE_DB_URL holding the connection string
# from Supabase → Project Settings → Database → Connection string → URI, with the password in it.
# GitHub encrypts it, never prints it, and masks it if a command ever tries to echo it.

name: Apply database migrations

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type APPLY to run the migrations against the live database'
        required: true
        default: ''
      dry_run:
        description: 'Only list what would run, change nothing'
        type: boolean
        default: false

concurrency:
  # Two runs applying migrations at once is how a database ends up half-migrated.
  group: apply-migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse unless the word was typed
        if: ${{ inputs.confirm != 'APPLY' }}
        run: |
          echo "::error::Type APPLY in the confirm box. This writes to the live database."
          exit 1

      - uses: actions/checkout@v4

      - name: Install the PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client

      # Two things make the obvious connection string fail, and neither is anybody's mistake.
      #
      # The direct host db.<ref>.supabase.co resolves to IPv6 only, and GitHub's runners have no
      # IPv6 route. The pooler is IPv4 but its hostname carries a region nobody should have to go
      # and look up.
      #
      # And a URI cannot carry a password containing '@' unless it is percent-encoded, which is a
      # trap nothing warns about: libpq reads everything after the last '@' as the host, so
      # `Bradpitt@9959@2005` silently becomes part of the server name.
      #
      # So no URI is built at all. The reference and password are taken out of the secret once,
      # by hand, and every connection after that is made with PGPASSWORD and separate flags —
      # where a password is a password whatever characters are in it.
      - name: Find a route to the database
        env:
          SECRET: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -uo pipefail
          if [ -z "$SECRET" ]; then
            echo "::error::The SUPABASE_DB_URL secret is not set. Repository → Settings → Secrets and variables → Actions → New repository secret."
            exit 1
          fi

          # Everything between the first ':' after the scheme and the last '@' is the password,
          # however many '@' it contains. Percent-encoding is undone, so an encoded secret and a
          # raw one both arrive here as the password the user actually typed.
          body=${SECRET#postgresql://}
          body=${body#postgres://}
          userinfo=${body%@*}
          hostpart=${body##*@}
          user=${userinfo%%:*}
          pass=${userinfo#*:}
          pass=$(printf '%b' "${pass//%/\\x}")
          echo "::add-mask::$pass"

          host=${hostpart%%:*}
          rest=${hostpart#*:}
          port=${rest%%/*}
          case "$port" in ''|*[!0-9]*) port=5432 ;; esac

          ref=$(printf '%s' "$host" | sed -nE 's#^db\.([a-z0-9]+)\.supabase\.co$#\1#p')
          [ -n "$ref" ] || ref=$(printf '%s' "$user" | sed -nE 's#^postgres\.([a-z0-9]+)$#\1#p')

          try() {
            PGPASSWORD="$pass" PGCONNECT_TIMEOUT=8 \
              psql -h "$1" -p "$2" -U "$3" -d postgres -tAc "select 1" >/dev/null 2>&1
          }

          save() {
            {
              echo "DBHOST=$1"; echo "DBPORT=$2"; echo "DBUSER=$3"; echo "PGPASSWORD=$pass"
            } >> "$GITHUB_ENV"
          }

          if try "$host" "$port" "$user"; then
            echo "Connected to $host as $user."
            save "$host" "$port" "$user"
            exit 0
          fi

          if [ -z "$ref" ]; then
            echo "::error::Could not connect, and the project reference is not in the connection string, so the pooler cannot be worked out. Copy the Session pooler string from Supabase → Project Settings → Database → Connection string."
            exit 1
          fi

          echo "Direct host unreachable — trying the pooler."
          for region in eu-central-1 eu-central-2 eu-west-1 eu-west-2 eu-west-3 eu-north-1 \
                        us-east-1 us-east-2 us-west-1 us-west-2 \
                        ap-south-1 ap-southeast-1 ap-southeast-2 ap-northeast-1 ap-northeast-2 \
                        ca-central-1 sa-east-1; do
            for prefix in aws-0 aws-1; do
              h="${prefix}-${region}.pooler.supabase.com"
              if try "$h" 5432 "postgres.${ref}"; then
                echo "Connected through ${prefix}-${region}."
                save "$h" 5432 "postgres.${ref}"
                exit 0
              fi
            done
          done

          echo "::error::No route opened. Every pooler region refused the connection, which means the password is wrong rather than the address — reset it in Supabase → Project Settings → Database, then update the SUPABASE_DB_URL secret."
          exit 1

      - name: Check the connection
        run: psql -h "$DBHOST" -p "$DBPORT" -U "$DBUSER" -d postgres -tAc "select 'connected to ' || current_database() || ' as ' || current_user"

      # Which migrations the database has already had. The table is created on first use, so a
      # database that has never been migrated this way simply reports none.
      - name: Read what has already been applied
        run: |
          psql -h "$DBHOST" -p "$DBPORT" -U "$DBUSER" -d postgres -v ON_ERROR_STOP=1 -q <<'SQL'
          create table if not exists public.schema_migrations (
            version text primary key,
            applied_at timestamptz not null default statement_timestamp(),
            checksum text
          );
          SQL
          psql -h "$DBHOST" -p "$DBPORT" -U "$DBUSER" -d postgres -tAc "select version from public.schema_migrations order by version" > applied.txt
          echo "Already applied: $(wc -l < applied.txt)"

      - name: Apply, in order, stopping at the first failure
        env:
          DRY: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          cd sarraf-system-nwe/sarraf-system/supabase/migrations
          applied=$GITHUB_WORKSPACE/applied.txt
          ran=0
          for f in $(ls *.sql | sort); do
            version="${f%%_*}"
            if grep -qxF "$version" "$applied"; then
              echo "  skip   $f"
              continue
            fi
            if [ "$DRY" = "true" ]; then
              echo "  would run  $f"
              continue
            fi
            echo "::group::$f"
            # Each migration in one transaction of its own: a failure leaves that file undone
            # rather than half-done, and the ones before it stay applied.
            sum=$(sha256sum "$f" | cut -d' ' -f1)
            psql -h "$DBHOST" -p "$DBPORT" -U "$DBUSER" -d postgres -v ON_ERROR_STOP=1 -q -f "$f"
            psql -h "$DBHOST" -p "$DBPORT" -U "$DBUSER" -d postgres -v ON_ERROR_STOP=1 -q \
              -c "insert into public.schema_migrations(version, checksum) values ('$version', '$sum') on conflict (version) do nothing"
            echo "::endgroup::"
            ran=$((ran + 1))
          done
          echo "Applied $ran migration(s)."

      - name: Say what the database looks like now
        if: ${{ !inputs.dry_run }}
        run: |
          echo "### Businesses" >> $GITHUB_STEP_SUMMARY
          psql -h "$DBHOST" -p "$DBPORT" -U "$DBUSER" -d postgres -tAc "select id || ' — ' || name from public.tenants order by id" >> $GITHUB_STEP_SUMMARY || true
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Accounts" >> $GITHUB_STEP_SUMMARY
          psql -h "$DBHOST" -p "$DBPORT" -U "$DBUSER" -d postgres -tAc "select coalesce(admin_level, role) || ' — ' || name || ' — ' || coalesce(tenant_id, 'no business') from public.app_users where not deleted order by 1" >> $GITHUB_STEP_SUMMARY || true
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Anything wrong" >> $GITHUB_STEP_SUMMARY
          psql -h "$DBHOST" -p "$DBPORT" -U "$DBUSER" -d postgres -tAc "select coalesce(string_agg(table_name || ' — ' || state, E'\n'), 'nothing') from public.sarraf_schema_tables()" >> $GITHUB_STEP_SUMMARY || true
