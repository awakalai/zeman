# The gate §15.24 asks for: nothing merges that a verifier refuses.
#
# Every check runs on every push and every pull request. They are split into separate jobs on
# purpose — a red tick should say WHICH contract broke without anyone opening a log — and the
# heavier ones only start once the fast ones have passed, so an obvious mistake fails in a
# minute instead of ten.
name: verify

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# A new push supersedes the run it interrupted; there is no value in verifying a commit the
# author has already replaced.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: sarraf-system-nwe/sarraf-system

jobs:
  # Unit tests and the production build. Everything else is gated behind these two.
  build-and-test:
    name: tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sarraf-system-nwe/sarraf-system/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      # The bundle budget is part of the build contract, not a nice-to-have: an oversized
      # bundle is a real cost on the phones this is used from.
      - name: Bundle and chunk contracts
        run: npm run verify:production
      - name: Upload the built bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: sarraf-system-nwe/sarraf-system/dist
          retention-days: 5

  # The static contracts. Cheap, and each one names its own failure.
  contracts:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        # names is the no-undef rule this repository has no linter for. Three identifiers that
        # were read and never declared made receipt upload throw ReferenceError inside an event
        # handler — no message, no rows, nothing on the screen — and every other gate passed.
        # i18n is a ratchet, not a target: the count of sentences written in one language
        # only is recorded, and this fails if it goes up. The hole cannot grow while it is
        # being closed.
        check: [brand, share, search, names, i18n]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sarraf-system-nwe/sarraf-system/package-lock.json
      - run: npm ci
      - run: npm run verify:${{ matrix.check }}

  # Dependency and source-level security contracts.  This is deliberately independent of
  # the build job so a vulnerable lockfile or a direct protected-table mutation gets its own
  # unmistakable failure instead of being buried in a build log.
  security:
    name: dependency and source security
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sarraf-system-nwe/sarraf-system/package-lock.json
      - run: npm ci
      - name: High-severity dependency audit
        run: npm audit --audit-level=high
      - name: Source and migration contracts
        run: npm run verify:source

  # The database contracts, against a real PostgreSQL rather than a mock. The verifier
  # provisions its own cluster, so no service container is declared here.
  accounting:
    name: accounting database contracts
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sarraf-system-nwe/sarraf-system/package-lock.json
      - name: Install PostgreSQL 16
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16 postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - run: npm ci
      # Every migration must apply to an empty database and every invariant must hold.
      - run: ZEMAN_DB_STRICT=1 npm run verify:accounting

  # The thirteen business flows of §14, walked end to end against a real database. The other
  # gates prove that pieces work; this one proves a day's business can be completed.
  flows:
    name: business flows
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sarraf-system-nwe/sarraf-system/package-lock.json
      - name: Install PostgreSQL 16
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16 postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - run: npm run verify:flows

  # Can one buyer's staff reach another buyer's rows? Every other database gate connects as the
  # superuser, which ignores row-level security entirely, so none of them has ever executed a
  # tenant policy. This one connects as `authenticated` and as `sarraf_definer`.
  isolation:
    name: tenant isolation
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sarraf-system-nwe/sarraf-system/package-lock.json
      - name: Install PostgreSQL 16
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16 postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - run: npm run verify:isolation

  # Each role driven through the shipped interface in a real browser.
  roles:
    name: per-role browser boundaries
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sarraf-system-nwe/sarraf-system/package-lock.json
      - run: npm ci
      # Playwright and the deterministic headless Chromium fallback are pinned in package-lock.
      # This keeps the gate reproducible even when the browser download CDN is unavailable.
      # CI=true makes a missing browser a failure rather than a silent skip.
      - run: ZEMAN_E2E_STRICT=1 npm run verify:roles

  # The one gate that stands on the line every other gate stops at.
  #
  # verify:flows executes the commands against a real database, but calls them itself, by hand
  # and correctly. verify:roles drives a real browser, but against a stub that answers anything
  # it is asked — including a call the database would refuse. Nine faults this month lived
  # exactly between them: an argument that never arrived, a verdict that was never sent, a free
  # variable that threw inside an event handler with nothing on the screen.
  #
  # This one puts the shipped bundle in Chromium and the real migrations in PostgreSQL, and lets
  # the browser form every call itself.
  journey:
    name: the receipt's journey
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sarraf-system-nwe/sarraf-system/package-lock.json
      - name: Install PostgreSQL 16
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16 postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - run: npm ci
      # A missing browser or database must fail here rather than pass quietly.
      - run: ZEMAN_JOURNEY_STRICT=1 npm run verify:journey

  # Every other gate here runs against a handful of rows, which answers "is this correct" and
  # says nothing at all about "will this still open in a year". This one seeds a real volume and
  # reads the plan PostgreSQL chooses, so a query that only works because the table is small
  # fails here instead of in somebody's second year of business.
  scale:
    name: the app at scale
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sarraf-system-nwe/sarraf-system/package-lock.json
      - name: Install PostgreSQL 16
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16 postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - run: npm run verify:scale

  # A single job to require in branch protection, so adding a check later does not mean
  # editing the protection rule. It fails if ANY of the above failed or was skipped.
  verified:
    name: verified
    runs-on: ubuntu-latest
    needs: [build-and-test, contracts, security, accounting, flows, isolation, roles, journey, scale]
    if: always()
    # This job reads nothing but needs.*.result, so it checks nothing out — and then the
    # workflow-level working-directory pointed it at a path that does not exist on a runner with
    # an empty workspace:
    #
    #   An error occurred trying to start process '/usr/bin/bash' with working directory
    #   '/home/runner/work/zeman/zeman/sarraf-system-nwe/sarraf-system'. No such file or directory
    #
    # The expression above it was correct and every one of the seven verifiers had passed. The
    # job that exists to say so could not start a shell to say it in.
    defaults:
      run:
        working-directory: .
    steps:
      - name: Refuse anything that did not pass
        run: |
          # Single quotes are the ONLY string delimiter a workflow expression accepts. The double
          # quotes that were here made the expression unparseable, and an unparseable expression
          # does not fail the job — it stops the whole workflow from starting. Every run since
          # this file was written ended in under a second with no jobs, and the tick beside each
          # commit was red for a reason nobody could open a log to see.
          results="${{ join(needs.*.result, ' ') }}"
          echo "upstream results: $results"
          for r in $results; do
            if [ "$r" != "success" ]; then
              echo "::error::a required verifier did not pass ($r) — this must not merge"
              exit 1
            fi
          done
          echo "every verifier passed"
